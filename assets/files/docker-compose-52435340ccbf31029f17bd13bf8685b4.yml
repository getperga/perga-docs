services:
  db:
    image: postgres:16.16-bookworm
    container_name: perga_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - perga_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/getperga/perga-api:latest
    container_name: perga_api
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - perga_network
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - attachments_data:/app/data/attachments

  web:
    image: ghcr.io/getperga/perga-web:latest
    container_name: perga_web
    restart: always
    environment:
      API_BASE_URL: ${API_BASE_URL}
      IS_SIGNUP_DISABLED: ${IS_SIGNUP_DISABLED}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      CSP_MODE: ${CSP_MODE:-report-only}
      CSP_POLICY: ${CSP_POLICY:-}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - perga_network

  nginx:
    build:
      context: ./nginx
    container_name: perga_nginx
    restart: always
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - perga_network

networks:
  perga_network:
    driver: bridge

volumes:
  postgres_data:
  attachments_data:
